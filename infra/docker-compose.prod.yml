name: aivastra-prod

# Env file lives at repo root as .env.production (git-ignored, created manually on VPS)
# CloudPanel NGINX reverse proxies:
#   app.aivastra.com/       → localhost:3000  (Next.js web)
#   app.aivastra.com/v1/    → localhost:4000  (Fastify API)
#   app.aivastra.com/minio/ → localhost:9000  (MinIO pass-through for presigned URLs)
#   app.aivastra.com/panel/ → localhost:3001  (Admin SPA)

services:
  postgres:
    image: postgres:16-alpine
    container_name: aivastra-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aivastra-net

  redis:
    image: redis:7-alpine
    container_name: aivastra-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aivastra-net

  minio:
    image: minio/minio:latest
    container_name: aivastra-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000 bound to host so CloudPanel NGINX can proxy /minio/ prefix
      - "127.0.0.1:9000:9000"
      # 9001 console — access via SSH tunnel only; do NOT expose publicly
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aivastra-net

  minio-bootstrap:
    image: minio/mc:latest
    container_name: aivastra-prod-minio-bootstrap
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${R2_BUCKET} &&
      mc anonymous set download local/${R2_BUCKET} &&
      echo 'minio bucket ready: ${R2_BUCKET}'
      "
    networks:
      - aivastra-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: aivastra-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    # Mount .env.production as /app/.env so `node --env-file=../../.env` resolves it
    volumes:
      - ../.env.production:/app/.env:ro
    # Run DB migrations before starting API
    command: >
      sh -c "
        cd /app/packages/db && pnpm migrate &&
        pnpm --filter @aivastra/api start
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aivastra-net

  dispatcher:
    build:
      context: ..
      dockerfile: apps/dispatcher/Dockerfile
    container_name: aivastra-prod-dispatcher
    restart: unless-stopped
    # Dispatcher uses process.env directly (no --env-file in its CMD)
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aivastra-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: aivastra-prod-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - aivastra-net

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    container_name: aivastra-prod-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - aivastra-net

  # Observability agent: tails container logs → Grafana Cloud Loki and scrapes
  # api/dispatcher /metrics → Grafana Cloud Prometheus. No public ports.
  alloy:
    image: grafana/alloy:latest
    container_name: aivastra-prod-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - api
      - dispatcher
    networks:
      - aivastra-net

volumes:
  pgdata:
  redisdata:
  miniodata:
  alloydata:

networks:
  aivastra-net:
    driver: bridge
