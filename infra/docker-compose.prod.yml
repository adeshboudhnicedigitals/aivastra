name: aivastra-prod

# Env file lives at repo root as .env.production (git-ignored, created manually on VPS)
# CloudPanel NGINX reverse proxies:
#   app.yourdomain.com  → localhost:3000
#   api.yourdomain.com  → localhost:4000

services:
  postgres:
    image: postgres:16-alpine
    container_name: aivastra-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aivastra-net

  redis:
    image: redis:7-alpine
    container_name: aivastra-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aivastra-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: aivastra-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    # Mount .env.production as /app/.env so `node --env-file=../../.env` resolves it
    volumes:
      - ../.env.production:/app/.env:ro
    # Run DB migrations before starting API
    command: >
      sh -c "
        cd /app/packages/db && pnpm migrate &&
        pnpm --filter @aivastra/api start
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aivastra-net

  dispatcher:
    build:
      context: ..
      dockerfile: apps/dispatcher/Dockerfile
    container_name: aivastra-prod-dispatcher
    restart: unless-stopped
    # Dispatcher uses process.env directly (no --env-file in its CMD)
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aivastra-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: aivastra-prod-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - aivastra-net

volumes:
  pgdata:
  redisdata:

networks:
  aivastra-net:
    driver: bridge
