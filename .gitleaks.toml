title = "aivastra gitleaks config"

[extend]
useDefault = true

[allowlist]
  description = "known non-secret test fixtures reused across integration tests"
  regexes = [
    '''test-jwt-secret-0123456789abcdef-32min''',
    '''Passw0rdTest123''',
    # Not a secret — a field assignment in models.routes.ts
    # (`bgComfyR2Key: body.bgComfyR2Key ?? null`). The generic-api-key rule
    # matches on the "...Key: <identifier>" shape; gitleaks re-scans this line
    # as "added" whenever its surrounding block is edited (e.g. wrapped in a
    # transaction) even though the line itself is unchanged.
    '''body\.bgComfyR2Key''',
    # Not a secret — test fixture object keys in catalogue-template-subcategories-admin.test.ts
    '''[al][12]-thumb\.jpg''',
    # Not a secret — a made-up SHOPIFY_PARTNER_API_TOKEN fixture in
    # env-partner-blank.test.ts, shaped like a Shopify token (shpat_ prefix) so the
    # generic-api-key rule matches it. It sits in commit 533bea7b, so editing the
    # test later would not clear the finding in the scanned history.
    '''shpat_1234567890abcdef''',
    # Not a secret — a made-up WhatsApp accessToken fixture in
    # apps/api/test/whatsapp-client.test.ts, pasted into its plan doc
    # (docs/superpowers/plans/2026-10-13-whatsapp-bot-3-whatsapp-adapter.md).
    # The generic-api-key rule matches the "accessToken: '<token>'" shape. It sits
    # in commits on feat/whatsapp-catalog-bot, which the scheduled full-history
    # scan covers, so editing the test later would not clear the finding.
    '''tok-0123456789abcdefghij''',
  ]
