# Assumes the outer edge (whatever proxies admin.aivastra.com) strips the
# /shopify-admin prefix before forwarding here — i.e. a
# `location /shopify-admin/ { proxy_pass http://shopify-admin:80/; }` style rule
# (trailing slash on both sides = strip). This container never sees that prefix;
# Vite's build already bakes /shopify-admin/ into index.html's asset URLs, and
# the browser re-requests those against the edge, which strips + forwards again.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Required for embedded Shopify apps: without it, Shopify's app review
    # flags the app for not restricting who can iframe it, and browsers apply
    # no framing restriction at all. A location block that sets its own
    # add_header stops inheriting this from the server block (nginx
    # semantics), so it's repeated in each location below rather than set
    # once here.
    set $csp "frame-ancestors https://*.myshopify.com https://admin.shopify.com;";

    # All paths fall back to index.html (SPA — client-side routing).
    # index.html itself must never be cached: it references the current
    # content-hashed JS/CSS bundle, and this SPA is reloaded into a fresh
    # iframe every time a merchant navigates from a native Shopify admin
    # page (Products, Customers, ...) back into the app. Without an explicit
    # no-cache here, the browser's heuristic caching can keep serving a
    # stale index.html (and therefore a stale, possibly pre-fix JS bundle)
    # indefinitely after a deploy, until something forces revalidation.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
