<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<script>
(function () {
  // Fires before App Bridge/React boot so a fresh install redirects to OAuth
  // immediately, rather than only after a full SPA boot discovers a 403 from
  // /v1/shopify/me (the slow path Shopify's automated review flags as
  // "didn't successfully initiate authentication when installing"). No-ops
  // — and the normal in-app boot path in App.tsx takes over — for anything
  // but a genuinely uninstalled shop: missing shop param, network failure,
  // or an already-installed store.
  var shop = new URLSearchParams(window.location.search).get('shop');
  if (!shop) return;
  // One redirect attempt per tab session. Without this, a shop that stays
  // uninstalled (OAuth never completes, a stuck install, a bounce back to
  // Shopify's install entry) gets redirected on every single load — an
  // unbounded loop that hammers {shop}.myshopify.com/admin/oauth/* until
  // Shopify throttles the shop with 429. Mirrors the same one-shot guard
  // App.tsx already applies to its FORBIDDEN redirect path
  // (shouldAttemptForbiddenRedirect in src/lib/appBridge.ts).
  var MARKER = 'aivastra:forbidden-oauth-redirect';
  try {
    if (sessionStorage.getItem(MARKER)) return;
  } catch (e) {
    // sessionStorage unavailable (partitioned/storage-blocked iframe) — with
    // no way to record the attempt there is no way to bound the redirects,
    // so don't start a loop we can't stop.
    return;
  }
  var breakoutLink;
  fetch('%VITE_API_BASE_URL%/v1/shopify/install-status?shop=' + encodeURIComponent(shop))
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (data && data.installed === false) {
        // Record the attempt only now that we're actually redirecting, so a
        // load that never needed OAuth doesn't burn this session's one shot.
        // App.tsx clears this marker on a successful /v1/shopify/me.
        try { sessionStorage.setItem(MARKER, '1'); } catch (e) { return; }
        // Assigning window.top.location.href here is a script-driven
        // navigation with no active user gesture behind it (this runs from a
        // fetch().then() continuation) — some browsers restrict exactly that
        // for a cross-origin iframe. Route through a target="_top" anchor's
        // native click handling instead, which isn't subject to that
        // restriction. Kept in sync with navigateTopLevel in src/lib/api.ts.
        breakoutLink = document.createElement('a');
        breakoutLink.href = '%VITE_API_BASE_URL%/v1/shopify/auth?shop=' + encodeURIComponent(shop);
        breakoutLink.target = '_top';
        breakoutLink.rel = 'noopener';
        // document.body doesn't exist yet — this script runs from <head>,
        // before <body> is parsed. document.documentElement (<html>) always
        // does.
        document.documentElement.appendChild(breakoutLink);
        breakoutLink.click();
        breakoutLink.remove();
      }
    })
    .catch(function () {
      // Swallow — App.tsx's existing FORBIDDEN fallback still handles it.
    });
})();
</script>
<title>AiVastra Try-On</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
