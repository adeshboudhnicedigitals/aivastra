# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "771a0258b180063d6015e4f5f8f1f586"
name = "AiVastra"
# Must be the embedded SPA's entry point, NOT /v1/shopify/auth. Shopify appends
# the host/id_token params App Bridge needs to whatever URL it opens here, and
# pointing this at the OAuth endpoint instead would send every app open through a
# full OAuth round trip that ends back at this URL — an infinite redirect loop.
# This value had drifted from the live Partner Dashboard config; a
# `shopify app deploy` would have overwritten the working URL with the broken one.
application_url = "https://app.aivastra.com/shopify-admin/embedded"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# These scopes are registered with Shopify and granted by Shopify's own install
# UI. `use_legacy_install_flow` is deliberately absent: with it set, the app had
# to run its own authorization-code redirect, which repeatedly re-entered
# Shopify's App Store install entry (/admin/oauth/redirect_to_install/embedded)
# and got the shop throttled with 429 during automated review. Under managed
# installation Shopify installs the app without calling us, and the first
# authenticated request's session token is exchanged for an offline access
# token (see exchangeSessionToken in apps/api/src/modules/shopify/token.ts).
scopes = "read_products,write_products"
optional_scopes = [ ]

[auth]
redirect_urls = [
  "https://app.aivastra.com/v1/shopify/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://app.aivastra.com/v1/shopify/webhooks/customers_redact"
  customer_data_request_url = "https://app.aivastra.com/v1/shopify/webhooks/customers_data_request"
  shop_deletion_url = "https://app.aivastra.com/v1/shopify/webhooks/shop_redact"
