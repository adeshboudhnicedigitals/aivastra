# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Staging-only app config — separate Partner Dashboard app record from both the
# production "AiVastra" app (shopify.app.toml) and the local-dev "AiVastra Dev"
# app (shopify.app.dev.toml). Points at the stable staging-app.aivastra.com
# domain so it never conflicts with the dev app's rotating ngrok tunnel. Deploy
# with `shopify app deploy --config staging` from this directory.

client_id = "b8098c4cd5deecfbe6b637090b650036"
name = "AiVastra Staging"
application_url = "https://staging-app.aivastra.com/shopify-admin/embedded"
embedded = true

[access_scopes]
# Mirrors shopify.app.toml — see that file for why use_legacy_install_flow is
# deliberately absent and how the managed-installation token exchange works.
scopes = "read_products,write_products"
optional_scopes = [ ]

[auth]
redirect_urls = [
  "https://staging-app.aivastra.com/v1/shopify/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://staging-app.aivastra.com/v1/shopify/webhooks/customers_redact"
  customer_data_request_url = "https://staging-app.aivastra.com/v1/shopify/webhooks/customers_data_request"
  shop_deletion_url = "https://staging-app.aivastra.com/v1/shopify/webhooks/shop_redact"
