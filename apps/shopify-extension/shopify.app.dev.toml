# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Dev-only app config — separate Partner Dashboard app record from the
# production "AiVastra" app (shopify.app.toml). Keeps `shopify app deploy`
# and local iteration from ever touching the live prod app's registered
# URLs. Update the ngrok host below whenever the tunnel rotates.

client_id = "2619ec2b9dab42d4468aa50cab0d6714"
name = "AiVastra Dev"
application_url = "https://wispy-plaza-mullets.ngrok-free.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Mirrors shopify.app.toml: managed installation, so no
# `use_legacy_install_flow` here either. See that file for why.
scopes = "read_products,write_products"
optional_scopes = [ ]

[auth]
redirect_urls = [
  "https://wispy-plaza-mullets.ngrok-free.dev/v1/shopify/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://wispy-plaza-mullets.ngrok-free.dev/v1/shopify/webhooks/customers_redact"
  customer_data_request_url = "https://wispy-plaza-mullets.ngrok-free.dev/v1/shopify/webhooks/customers_data_request"
  shop_deletion_url = "https://wispy-plaza-mullets.ngrok-free.dev/v1/shopify/webhooks/shop_redact"
