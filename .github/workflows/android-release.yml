name: Android (virtual_tryon_android)

# check — Android lint + unit tests. Runs on every trigger below.
# build — signed release APK + AAB, published as a run artifact. Runs only on
#         a tag or a manual run, and only after `check` passes. On a tag the
#         APK is also sent to Firebase App Distribution.
# publish-play — tags only. Waits for approval on the `play-store`
#         environment, then uploads this run's AAB to Google Play.
#
# Triggers:
#   - pull_request touching the app — `check` only.
#   - tag push `vta-v*` — works from any branch, because GitHub reads this file
#     from the tagged commit.
#   - workflow_dispatch — only available once this file is on the default
#     branch (main).

on:
  workflow_dispatch:
  push:
    tags:
      - 'vta-v*'
  pull_request:
    paths:
      - 'apps/virtual_tryon_android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # A newer push to a PR supersedes the old check; a release build is never
  # cancelled half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/virtual_tryon_android
    steps:
      - uses: actions/checkout@v4

      # AGP 9.x requires JDK 17+ to run Gradle, independent of the app's
      # Java 11 source/target compatibility.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The google-services plugin fails configuration without this file, even
      # for lint. Secrets are not passed to pull requests from forks, so say
      # that plainly instead of failing on an empty base64 decode.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.VTA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::VTA_GOOGLE_SERVICES_JSON_BASE64 is unavailable (pull requests from forks do not receive secrets)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          test -s app/google-services.json

      # --continue so a lint failure does not hide a test failure (or the
      # reverse) behind a second push.
      - name: Lint + unit tests
        run: ./gradlew lintDebug testDebugUnitTest --continue --no-daemon

      - name: Upload lint + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-tryon-reports
          path: |
            apps/virtual_tryon_android/app/build/reports/lint-results-debug.html
            apps/virtual_tryon_android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/virtual_tryon_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # keystore.properties, the keystore and google-services.json are all
      # gitignored, so they are rebuilt from secrets on every run. Values go
      # through env rather than being interpolated into the script, so they
      # never appear in the rendered command.
      - name: Restore signing + Firebase config
        env:
          KEYSTORE_B64: ${{ secrets.VTA_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.VTA_GOOGLE_SERVICES_JSON_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VTA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VTA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VTA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # app/build.gradle.kts silently skips signing when keystore.properties
          # is missing, which would give a green run with an unsigned build.
          test -s release.jks
          test -s keystore.properties
          test -s app/google-services.json

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: virtual-tryon-release
          path: |
            apps/virtual_tryon_android/app/build/outputs/apk/release/*.apk
            apps/virtual_tryon_android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Tags only: a manual run builds the artifact without notifying testers.
      # Runs after the artifact upload so a Firebase failure still leaves the
      # signed APK + AAB downloadable from the run.
      # VTA_FIREBASE_TESTER_GROUPS is a repo *variable* (comma-separated group
      # aliases). Unset means the release is uploaded but nobody is notified.
      - name: Distribute APK to Firebase App Distribution
        if: startsWith(github.ref, 'refs/tags/vta-v')
        env:
          FIREBASE_APP_ID: ${{ secrets.VTA_FIREBASE_APP_ID }}
          FIREBASE_SA_JSON: ${{ secrets.VTA_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ vars.VTA_FIREBASE_TESTER_GROUPS }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"

          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NOTES="$TAG_NAME — $(git log -1 --pretty=%s)"

          ARGS=(--app "$FIREBASE_APP_ID" --release-notes "$NOTES")
          if [ -n "$TESTER_GROUPS" ]; then
            ARGS+=(--groups "$TESTER_GROUPS")
          else
            echo "::warning::VTA_FIREBASE_TESTER_GROUPS is not set — release uploaded, no testers notified."
          fi

          # The CLI prints a tokenised direct-download link for the binary. This
          # repo is public, so its Actions logs are too — drop that line.
          # pipefail keeps a CLI failure from being masked by grep's exit code.
          set -o pipefail
          npx --yes firebase-tools@latest appdistribution:distribute "$APK" "${ARGS[@]}" \
            | grep -v "app-binary-downloads"

      - name: Remove signing material
        if: always()
        run: |
          rm -f release.jks keystore.properties app/google-services.json
          rm -f "$RUNNER_TEMP/firebase-sa.json"

  # Play upload is gated by the `play-store` environment: the run pauses here
  # until one of its required reviewers approves, which is meant to happen
  # only after the Firebase build above has been tested. It uploads the AAB
  # built by `build` in this same run — never a rebuild — so what reaches Play
  # is the bundle built from the exact commit the testers' APK came from.
  #
  # The environment MUST exist with required reviewers before this job runs:
  # GitHub auto-creates a missing environment with no protection, and the
  # upload would then go straight through unapproved.
  #
  # The artifact is kept 14 days, so approval has to land within that window.
  publish-play:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vta-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virtual-tryon-release
          path: dist

      # Third-party action handling the Play credential, so it is pinned to a
      # commit SHA (v1.1.5) rather than a movable tag.
      # VTA_PLAY_TRACK is a repo variable; unset means the internal testing
      # track, which never reaches the public without a manual promotion in
      # Play Console.
      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.VTA_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: aivastra.nice.interactive
          releaseFiles: dist/bundle/release/*.aab
          track: ${{ vars.VTA_PLAY_TRACK || 'internal' }}
          status: completed
