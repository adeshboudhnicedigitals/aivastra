name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # 02:30 UTC daily — validates the whole monorepo regardless of any diff, so a
    # detector misclassification surfaces within a day instead of at the next incident.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: Build, test and deploy every service regardless of the diff
        type: boolean
        default: false
      services:
        description: 'Comma-separated service subset, e.g. "api,web". Leave empty unless overriding.'
        type: string
        default: ''

# Pull requests supersede themselves; main pushes never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22

jobs:
  detect:
    name: Detect affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
      compose_services: ${{ steps.detect.outputs.compose_services }}
      test_targets: ${{ steps.detect.outputs.test_targets }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      fallback_to_all: ${{ steps.detect.outputs.fallback_to_all }}
      migration_changed: ${{ steps.detect.outputs.migration_changed }}
      has_deployable: ${{ steps.detect.outputs.has_deployable }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_packages: ${{ steps.detect.outputs.has_packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected targets
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          # A scheduled run has no meaningful diff range, so it always forces all.
          FORCE_ALL: ${{ (github.event_name == 'schedule' || inputs.force_all) && 'true' || 'false' }}
          SERVICES_OVERRIDE: ${{ inputs.services }}
        run: pnpm ci:detect --out affected.json

      - name: Upload detector result
        uses: actions/upload-artifact@v4
        with:
          name: affected-targets
          path: affected.json
          retention-days: 14

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect]
    if: needs.detect.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect]
    if: needs.detect.outputs.has_packages == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # Per-package typecheck filtering is Phase 2. Phase 1 keeps the whole-workspace
      # typecheck but now skips this job entirely for docs-only pushes, which is where
      # the time is actually saved.
      - name: Typecheck workspace
        run: pnpm -r --filter "!@aivastra/admin-mobile" run typecheck

  test:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect]
    if: needs.detect.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.test_targets) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # Both suites use apps/api/test/helpers/containers.ts, which provisions a
      # fresh database and bucket against these services on localhost.
      - name: Start test infra (Postgres, Redis, MinIO)
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio

      - name: Run unit tests
        run: pnpm --filter ${{ matrix.package }} test:unit

  ci-scripts:
    name: Detector tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run detector tests
        run: pnpm test:ci-scripts

      - name: Run staging env guardrail tests
        run: bash scripts/staging/check-staging-env.test.sh

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [detect, lint, typecheck, test, ci-scripts]

    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded or were intentionally skipped"

  deploy:
    name: Deploy affected services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, ci-gate]
    # `!cancelled()` is load-bearing, not decoration. GitHub propagates a
    # `skipped` result transitively down the whole needs graph: when nothing
    # testable changed, `test` skips (empty matrix), and that skip reaches
    # `deploy` through `ci-gate` even though ci-gate itself has `always()`
    # and succeeds — `always()` rescues only the job it is written on, not
    # its descendants. A job escapes the propagation only if its own `if:`
    # contains a status-check function, so without this the deploy silently
    # skipped on every admin/web-only merge. Because adding a status
    # function also drops the implicit `success()` on `needs`, the two
    # result checks below restore that gate explicitly.
    if: >-
      !cancelled() &&
      needs.detect.result == 'success' &&
      needs['ci-gate'].result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect.outputs.has_deployable == 'true'
    concurrency:
      # Prod and staging must never share a group: a staging deploy must not be
      # able to queue behind or cancel a production deploy.
      group: aivastra-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false

    steps:
      - name: Resolve deploy target
        env:
          PROD_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
            echo "TARGET_ENV=production"                             >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=main"                                >> "$GITHUB_ENV"
            echo "COMPOSE_FILE=infra/docker-compose.prod.yml"        >> "$GITHUB_ENV"
            echo "ENV_FILE=.env.production"                          >> "$GITHUB_ENV"
            echo "TARGET_DEPLOY_PATH=${PROD_DEPLOY_PATH}"            >> "$GITHUB_ENV"
          else
            echo "TARGET_ENV=staging"                                >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=dev"                                 >> "$GITHUB_ENV"
            echo "COMPOSE_FILE=infra/docker-compose.staging.yml"     >> "$GITHUB_ENV"
            echo "ENV_FILE=.env.staging"                             >> "$GITHUB_ENV"
            echo "TARGET_DEPLOY_PATH=${STAGING_DEPLOY_PATH}"         >> "$GITHUB_ENV"
          fi
          echo "resolved target: $(grep TARGET_ENV "$GITHUB_ENV")"

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ env.TARGET_DEPLOY_PATH }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          ENV_FILE: ${{ env.ENV_FILE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVICES: ${{ needs.detect.outputs.compose_services }}
          MIGRATION_CHANGED: ${{ needs.detect.outputs.migration_changed }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/deploy_key' EXIT

          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key

          echo "deploying services: ${SERVICES} at ${DEPLOY_SHA}"

          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${VPS_USER}@${VPS_HOST}" \
              "set -euo pipefail
               SERVICES='${SERVICES}'
               MIGRATION_CHANGED='${MIGRATION_CHANGED}'
               DEPLOY_SHA='${DEPLOY_SHA}'
               TARGET_ENV='${TARGET_ENV}'
               TARGET_BRANCH='${TARGET_BRANCH}'
               COMPOSE=\"docker compose -f ${COMPOSE_FILE} --env-file ${ENV_FILE}\"

               echo \"→ checking out \${DEPLOY_SHA}\"
               git config --global --add safe.directory ${DEPLOY_PATH}
               cd ${DEPLOY_PATH}
               # Reset to the exact commit this run tested, not to whatever main
               # points at right now: with two merges landing close together the
               # earlier run would otherwise ship the later run's code, and the
               # SHA that passed CI would not be the SHA deployed. Fetching main
               # first guarantees the commit is present (it is always an ancestor
               # of, or equal to, the branch tip) without relying on the server
               # allowing a bare-SHA fetch.
               git fetch https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git \${TARGET_BRANCH}
               git reset --hard \${DEPLOY_SHA}

               if [ \"\${TARGET_ENV}\" = 'staging' ]; then
                 echo '→ verifying .env.staging is not production'
                 bash scripts/staging/check-staging-env.sh .env.staging ../app.aivastra.com/.env.production
               fi

               echo \"→ building images for: \${SERVICES}\"
               \${COMPOSE} build \${SERVICES}

               if [ \"\${MIGRATION_CHANGED}\" = 'true' ]; then
                 echo '→ applying DB migrations'
                 \${COMPOSE} run --rm api pnpm db:migrate:prod
               else
                 echo '→ no migration changes; skipping migrate'
               fi

               echo '→ verifying all migrations applied'
               \${COMPOSE} run --rm api pnpm db:verify:prod

               echo \"→ recreating: \${SERVICES}\"
               \${COMPOSE} up -d --no-deps --force-recreate \${SERVICES}

               echo '→ cleaning dangling images'
               docker image prune -f

               echo \"✓ deploy done: \${SERVICES}\""
