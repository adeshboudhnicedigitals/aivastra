name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      - name: Typecheck all packages
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types + db required by tests)
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # Despite the "unit" name, apps/api's test:unit suite (everything outside
      # test/integration/**) still hits real Postgres/Redis/MinIO via
      # apps/api/test/helpers/containers.ts — same infra `pnpm docker:up` provides
      # locally. No .env needed: every var here has a default baked into
      # infra/docker-compose.yml matching containers.ts's own hardcoded defaults.
      - name: Start test infra (Postgres, Redis, MinIO)
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio

      - name: Run dispatcher unit tests
        run: pnpm --filter @aivastra/dispatcher test:unit

      - name: Run API unit tests
        run: pnpm --filter @aivastra/api test:unit

  deploy:
    name: SSH → git pull → docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key

          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${VPS_USER}@${VPS_HOST}" \
              "set -e
               echo '→ pulling latest code'
               git config --global --add safe.directory ${DEPLOY_PATH}
               cd ${DEPLOY_PATH}
               git fetch https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git main
               git reset --hard FETCH_HEAD

               echo '→ pulling base images'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 pull postgres redis

               echo '→ building images'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 build

               echo '→ recreating postgres (picks up new image)'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 up -d --force-recreate postgres

               echo '→ applying DB migrations'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 run --rm api pnpm db:migrate:prod

               echo '→ verifying all migrations applied'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 run --rm api pnpm db:verify:prod

               echo '→ restarting services'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 up -d --force-recreate

               echo '→ cleaning old images'
               docker image prune -f

               echo '✓ deploy done'"

          rm -f /tmp/deploy_key
