name: CI Bench

# Throwaway benchmark: ci.yml run unmodified-in-substance on the self-hosted bench
# runner (scripts/bench/), to compare job time and RAM at 2 vs 4 vs 8 CPUs.
# Has no deploy job. Delete this file, with scripts/bench/, once the report is done.
on:
  push:
    branches: [ci/self-hosted-bench]
  workflow_dispatch:
    inputs:
      force_all:
        description: Build and test every service regardless of the diff
        type: boolean
        default: true
      services:
        description: 'Comma-separated service subset. Leave empty unless overriding.'
        type: string
        default: ''

concurrency:
  group: ci-bench
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22

jobs:
  detect:
    name: Detect affected targets
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    outputs:
      services: ${{ steps.detect.outputs.services }}
      compose_services: ${{ steps.detect.outputs.compose_services }}
      test_targets: ${{ steps.detect.outputs.test_targets }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      fallback_to_all: ${{ steps.detect.outputs.fallback_to_all }}
      migration_changed: ${{ steps.detect.outputs.migration_changed }}
      has_deployable: ${{ steps.detect.outputs.has_deployable }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_packages: ${{ steps.detect.outputs.has_packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected targets
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          # A scheduled run has no meaningful diff range, so it always forces all.
          FORCE_ALL: 'true'
          SERVICES_OVERRIDE: ${{ inputs.services }}
        run: pnpm ci:detect --out affected.json

      - name: Upload detector result
        uses: actions/upload-artifact@v4
        with:
          name: affected-targets
          path: affected.json
          retention-days: 14

  lint:
    name: Lint & format
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    needs: [detect]
    # Skip on push: branch protection on main/dev blocks direct pushes and
    # requires ci-gate to pass before a PR can merge, so every push event is
    # definitionally a merge of a tree this job already validated at PR time
    # (actions/checkout's default pull_request ref is the PR-vs-base test
    # merge commit, so it's not just the PR head either). Re-running here
    # bought no additional coverage, only ~7 redundant CI minutes on every
    # single merge — this is what deploy actually needs to not wait on.
    if: needs.detect.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

  typecheck:
    name: Typecheck
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    needs: [detect]
    # See lint's comment — skip on push, already validated at PR time.
    if: needs.detect.outputs.has_packages == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # Per-package typecheck filtering is Phase 2. Phase 1 keeps the whole-workspace
      # typecheck but now skips this job entirely for docs-only pushes, which is where
      # the time is actually saved.
      - name: Typecheck workspace
        run: pnpm -r --filter "!@aivastra/admin-mobile" run typecheck

  test:
    name: Unit tests (${{ matrix.package }})
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    needs: [detect]
    # See lint's comment — skip on push, already validated at PR time.
    if: needs.detect.outputs.has_tests == 'true'
    # Job-level `permissions` replaces the default token scope entirely, so
    # `contents: read` has to be listed alongside `packages: read` or
    # actions/checkout below loses its read access.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.test_targets) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # quay.io withdrew anonymous pulls for minio/minio and minio/mc (both
      # Docker Hub and quay.io have now locked the images down — see the
      # infra/docker-compose.yml minio comment) — GITHUB_TOKEN reads the
      # private ghcr.io mirror instead. The token is scoped to this run only
      # (packages: read above) and needs the repo added under each package's
      # "Manage Actions access" or the pull below still gets refused.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both suites use apps/api/test/helpers/containers.ts, which provisions a
      # fresh database and bucket against these services on localhost.
      - name: Start test infra (Postgres, Redis, MinIO)
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio

      - name: Run unit tests
        run: pnpm --filter ${{ matrix.package }} test:unit

      - name: Tear down test infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  test-integration:
    name: Integration tests (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: [self-hosted, bench]
    # 15, not 10: with two shards per suite each shard carries more tests, and an
    # unsharded api run was already seen at ~10 min.
    timeout-minutes: 90
    needs: [detect]
    # See lint's comment — skip on push, already validated at PR time. Every step
    # below carries the same event check, but without it here each of the four
    # shards still starts a runner, runs no steps, and is billed a full minute.
    # See test's comment — contents: read has to be listed alongside
    # packages: read or the job-level override drops checkout's access.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Only apps/api and apps/dispatcher have a test:integration script.
        # Both suites are split across two runners with Vitest's --shard.
        # Every shard gets its own docker stack, so shards share nothing even
        # though the dispatcher suite runs its files serially within a shard
        # (singleFork). Each shard repeats install/build/docker startup, which
        # is the price of cutting wall time. Two shards, not three: billed time
        # is the sum of every job, so each extra shard adds another copy of that
        # setup.
        include:
          - package: '@aivastra/api'
            shard: 1/2
          - package: '@aivastra/api'
            shard: 2/2
          - package: '@aivastra/dispatcher'
            shard: 1/2
          - package: '@aivastra/dispatcher'
            shard: 2/2
    # `matrix` isn't in the allowed-context list for a job-level `if:` (only
    # github/inputs/needs/vars are — see actionlint's expression check), so the
    # per-package skip has to live on every step instead of the job. A skipped
    # step still reports job result 'success' (not 'skipped'), which ci-gate's
    # success|skipped check already treats the same way, so gating behavior is
    # unchanged — this only moves *where* the condition is evaluated.
    steps:
      - uses: actions/checkout@v4
        if: contains(needs.detect.outputs.test_targets, matrix.package)

      - uses: pnpm/action-setup@v4
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        run: |
          pnpm --filter @aivastra/db build
          pnpm --filter @aivastra/types build
          pnpm --filter @aivastra/logger build
          pnpm --filter @aivastra/storage build
          pnpm --filter @aivastra/observability build

      # See test's comment — private ghcr.io mirror, quay.io withdrew anonymous pulls.
      - name: Log in to GHCR
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same fresh-DB-per-file harness as the unit job (apps/api/test/helpers/containers.ts).
      - name: Start test infra (Postgres, Redis, MinIO)
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio

      - name: Run integration tests
        if: contains(needs.detect.outputs.test_targets, matrix.package)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter ${{ matrix.package }} test:integration ${SHARD:+--shard=$SHARD}

      - name: Tear down test infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  ci-scripts:
    name: Detector tests
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    needs: [detect]
    # See lint's comment — skip on push, already validated at PR time.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run detector tests
        run: pnpm test:ci-scripts

      - name: Run staging env guardrail tests
        run: bash scripts/staging/check-staging-env.test.sh

      - name: Check migration index collisions against dev
        run: pnpm ci:check-migration-index

  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p "$HOME/.local/bin"
          install /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gitleaks version

      - name: Scan for committed secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # .gitleaks-baseline.json freezes every finding as of the commit it was
          # generated from (see docs/version-control.md) — this repo's pre-existing
          # history is not re-litigated on every run; only genuinely new secrets fail.
          RANGE=""
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${BASE_REF}" ]]; then
            git fetch --depth=50 origin "${BASE_REF}"
            RANGE="origin/${BASE_REF}..HEAD"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${BEFORE_SHA}..${GITHUB_SHA}"
          fi
          if [[ -n "${RANGE}" ]]; then
            echo "scanning range: ${RANGE}"
            gitleaks detect --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --log-opts="${RANGE}" --redact
          else
            echo "no usable diff range (schedule/dispatch/first push) — scanning full history"
            gitleaks detect --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --redact
          fi

  branch-source-gate:
    name: branch-source-gate
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    # Only meaningful for PRs targeting main; skipped otherwise so ci-gate's
    # success/skipped check below still passes for dev-bound and non-PR runs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Restrict main to promotions from dev or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" == "dev" || "${HEAD_REF}" == hotfix/* ]]; then
            echo "ok: '${HEAD_REF}' is an allowed source branch for main"
          else
            echo "::error::main only accepts PRs from 'dev' or a 'hotfix/*' branch (got '${HEAD_REF}')"
            exit 1
          fi

  ci-gate:
    name: ci-gate
    runs-on: [self-hosted, bench]
    timeout-minutes: 90
    if: always()
    needs: [detect, lint, typecheck, test, test-integration, ci-scripts, gitleaks, branch-source-gate]

    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded or were intentionally skipped"
