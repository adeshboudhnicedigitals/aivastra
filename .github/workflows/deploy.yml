name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: SSH → git pull → docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Debug secrets presence
        run: |
          echo "VPS_HOST set: ${{ secrets.VPS_HOST != '' }}"
          echo "VPS_USER set: ${{ secrets.VPS_USER != '' }}"
          echo "VPS_SSH_KEY set: ${{ secrets.VPS_SSH_KEY != '' }}"
          echo "DEPLOY_PATH set: ${{ secrets.DEPLOY_PATH != '' }}"

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key

          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${VPS_USER}@${VPS_HOST}" \
              "set -e
               echo '→ pulling latest code'
               cd ${DEPLOY_PATH}
               git pull origin master

               echo '→ building images'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 build

               echo '→ restarting services'
               docker compose -f infra/docker-compose.prod.yml \
                 --env-file .env.production \
                 up -d

               echo '→ cleaning old images'
               docker image prune -f

               echo '✓ deploy done'"

          rm -f /tmp/deploy_key
