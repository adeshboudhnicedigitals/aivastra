<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aivastra Kiosk — Dialog (real structure: dialog_select_vastra_gender.xml)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Faithful to dialog_select_vastra_gender.xml: this dialog reuses the exact
     same "for" list rows as the home screen (item_vastra_for), centered in a
     panel over a dim scrim, with a small cancel (X) icon top-right of the
     panel. It is NOT a theme/occasion grid — that content doesn't exist here. */
  .backdrop-content { flex: 1; padding: var(--space-xl); filter: blur(3px) brightness(0.92); opacity: 0.9; pointer-events: none; position: relative; }
  .backdrop-list { max-width: 640px; margin: 90px auto 0; display: flex; flex-direction: column; gap: 12px; }
  .backdrop-row { height: 90px; background: var(--color-surface-variant); }

  .scrim-layer { position: absolute; inset: 0; background: var(--color-overlay-scrim); display: flex; align-items: center; justify-content: center; }
  .panel {
    width: 640px; background: var(--color-surface);
    box-shadow: var(--shadow-elevated);
    padding: var(--space-lg);
    position: relative;
    animation: pop-in .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop-in { from { transform: scale(0.96); opacity:0; } to { transform: scale(1); opacity:1; } }
  .cancel-x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  .panel-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .for-row {
    position: relative; height: 90px; background: var(--color-surface-variant); display: flex; align-items: flex-end;
  }
  .for-row .label-bar { height: 54px; flex: 1; background: var(--gradient-primary); display: flex; align-items: center; justify-content: flex-end; padding-right: 50px; }
  .for-row.align-start .label-bar { justify-content: flex-start; padding-right: 0; padding-left: 50px; }
  .for-row .label-bar .txt { color: #fff; font: 800 18px/1 'Poppins'; text-transform: uppercase; }
  .for-row .glyph { position: absolute; bottom: 6px; left: 12px; width: 62px; height: 62px; background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .for-row.align-start .glyph { left: auto; right: 12px; }
  .for-row .glyph svg { width: 32px; height: 32px; stroke: var(--brand-purple); stroke-width: 1.6; fill: none; }
</style>
</head>
<body>
<div class="kiosk-stage">
  <div>
    <div class="frame-label">Screen 4 / 4 — Dialog · matches dialog_select_vastra_gender.xml (1:1 structure) · 1280×800</div>
    <div class="kiosk-frame">
      <div class="kiosk-screen">

        <div class="backdrop-content">
          <div class="backdrop-list">
            <div class="backdrop-row cut-lg"></div><div class="backdrop-row cut-lg"></div>
          </div>
        </div>

        <div class="scrim-layer">
          <div class="panel cut-lg">
            <div class="cancel-x"><svg width="18" height="18" viewBox="0 0 24 24" stroke="var(--color-on-surface-variant)" stroke-width="2.4" fill="none"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
            <div class="panel-list">
              <div class="for-row cut-sm">
                <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/></svg></div>
                <div class="label-bar cut-sm"><span class="txt">Men</span></div>
              </div>
              <div class="for-row align-start cut-sm">
                <div class="label-bar cut-sm"><span class="txt">Women</span></div>
                <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/></svg></div>
              </div>
              <div class="for-row cut-sm">
                <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 21c0-3.8 3-6 7-6s7 2.2 7 6"/></svg></div>
                <div class="label-bar cut-sm"><span class="txt">Boy</span></div>
              </div>
              <div class="for-row align-start cut-sm">
                <div class="label-bar cut-sm"><span class="txt">Girl</span></div>
                <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 21c0-3.8 3-6 7-6s7 2.2 7 6"/></svg></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
