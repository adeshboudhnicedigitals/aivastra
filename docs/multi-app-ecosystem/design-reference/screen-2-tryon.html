<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aivastra Kiosk — Try-On (real structure: activity_vastra_try_on.xml)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Faithful to activity_vastra_try_on.xml: ll_toolbar (back pill + logo) on top,
     60/40 split below — left = captured photo panel with a hidden/shown
     "Continue" button, right = category dropdown + a single-column vertical
     list of 100x100 item thumbnails + up/down scroll arrows. No camera
     viewfinder, no 2-col grid, no "Try It On" CTA — none of that exists here. */
  .split { flex: 1; display: flex; padding: 20px 14px 20px 20px; gap: 10px; overflow: hidden; }
  .photo-pane { flex: 0 0 60%; position: relative; background: var(--color-surface-variant); }
  .photo-pane .continue-btn {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 92px; height: 72px; background: var(--gradient-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: var(--shadow-floating);
  }
  .photo-pane .continue-btn svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.4; fill: none; }
  .photo-pane .continue-btn span { color: #fff; font: 700 10px/1 'Poppins'; text-transform: uppercase; letter-spacing: .04em; }
  .photo-pane .placeholder-figure { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: .5; }

  .item-pane { flex: 1; display: flex; flex-direction: column; padding-left: 6px; }
  .dropdown {
    height: 44px; background: var(--gradient-primary);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 10px;
  }
  .dropdown span { color: #fff; font: 700 12px/1 'Poppins'; text-transform: uppercase; letter-spacing: .04em; }
  .dropdown svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.4; fill: none; }

  .item-col { flex: 1; overflow: hidden; background: var(--color-surface-variant); padding: 10px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .thumb { width: 100px; height: 100px; background: var(--color-surface); box-shadow: var(--shadow-card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .thumb.selected { outline: 3px solid var(--brand-purple); outline-offset: -3px; }
  .thumb svg { width: 56%; opacity: .85; }

  .scroll-arrows { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }
  .scroll-arrows .icon-btn { width: 36px; height: 36px; }
  .scroll-arrows svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="kiosk-stage">
  <div>
    <div class="frame-label">Screen 2 / 4 — Try-On · matches activity_vastra_try_on.xml (1:1 structure) · 1280×800</div>
    <div class="kiosk-frame">
      <div class="kiosk-screen">

        <div class="top-nav" style="height:78px;">
          <div class="back-pill-inline icon-btn rounded-sm" style="width:44px;height:30px;"><svg width="16" height="16" viewBox="0 0 24 24" stroke="var(--color-on-surface)" stroke-width="2.5" fill="none"><path d="M15 18l-6-6 6-6"/></svg></div>
          <div style="display:flex;align-items:center;gap:8px;"><span style="width:22px;height:22px;background:var(--gradient-primary);" class="cut-sm"></span><span class="text-title" style="font-size:16px;">AIVASTRA</span></div>
        </div>

        <div class="split">
          <div class="photo-pane cut-lg">
            <div class="placeholder-figure">
              <svg width="180" viewBox="0 0 120 240"><path d="M60 8c15 0 24 12 24 27 0 10-5 18-5 18 20 8 27 25 29 58l4 121H8l4-121c2-33 9-50 29-58 0 0-5-8-5-18 0-15 9-27 24-27z" fill="#a803e5" opacity="0.3"/></svg>
            </div>
            <div class="continue-btn cut-sm">
              <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              <span>Continue</span>
            </div>
          </div>

          <div class="item-pane">
            <div class="dropdown cut-sm"><span>Silk Saree</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
            <div class="item-col cut-sm">
              <div class="thumb selected cut-sm"><svg viewBox="0 0 60 60"><rect x="10" y="8" width="40" height="46" rx="2" fill="#a803e5" opacity="0.5"/></svg></div>
              <div class="thumb cut-sm"><svg viewBox="0 0 60 60"><rect x="10" y="8" width="40" height="46" rx="2" fill="#f5881e" opacity="0.5"/></svg></div>
              <div class="thumb cut-sm"><svg viewBox="0 0 60 60"><rect x="10" y="8" width="40" height="46" rx="2" fill="#cc30dc" opacity="0.5"/></svg></div>
            </div>
            <div class="scroll-arrows">
              <div class="icon-btn rounded-sm"><svg viewBox="0 0 24 24" stroke="var(--color-on-surface-variant)" stroke-width="2.4" fill="none"><path d="M6 15l6-6 6 6"/></svg></div>
              <div class="icon-btn rounded-sm"><svg viewBox="0 0 24 24" stroke="var(--color-on-surface-variant)" stroke-width="2.4" fill="none"><path d="M6 9l6 6 6-6"/></svg></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
