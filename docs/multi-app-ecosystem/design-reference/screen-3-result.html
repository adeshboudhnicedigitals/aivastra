<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aivastra Kiosk — Result (real structure: activity_vastra_try_on_result.xml)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Faithful to activity_vastra_try_on_result.xml: full-bleed result image,
     a thin decorative top light strip, back pill top-left, merchant logo
     top-right, and a vertical rail of exactly 3 icon buttons (like, download,
     add-to-cart) centered on the right edge. No price/SKU/QR/secondary CTA —
     none of that exists on this screen in the real app. */
  .result-stage { flex: 1; position: relative; background: var(--color-surface-variant); overflow: hidden; }
  .light-strip { position: absolute; top: 0; left: 0; right: 0; height: 140px; background: linear-gradient(180deg, rgba(168,3,229,0.14), transparent); }
  .result-figure-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .back-pill { position: absolute; top: 18px; left: 22px; width: 44px; height: 30px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); }
  .merchant-logo { position: absolute; top: 18px; right: 22px; width: 70px; height: 34px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; font: 700 10px/1 'Poppins'; color: var(--color-on-surface-variant); box-shadow: var(--shadow-card); }
  .action-rail { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; }
  .action-rail .icon-btn { width: 52px; height: 52px; background: rgba(255,255,255,0.92); }
</style>
</head>
<body>
<div class="kiosk-stage">
  <div>
    <div class="frame-label">Screen 3 / 4 — Result · matches activity_vastra_try_on_result.xml (1:1 structure) · 1280×800</div>
    <div class="kiosk-frame">
      <div class="kiosk-screen">

        <div class="result-stage">
          <div class="light-strip"></div>

          <div class="result-figure-wrap">
            <svg width="260" viewBox="0 0 140 300"><path d="M70 10c17 0 28 14 28 31 0 12-6 21-6 21 24 10 33 30 35 68l6 150H8l6-150c2-38 11-58 35-68 0 0-6-9-6-21 0-17 11-31 28-31z" fill="url(#rg)"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5881e"/><stop offset="0.5" stop-color="#cc30dc"/><stop offset="1" stop-color="#a803e5"/></linearGradient></defs></svg>
          </div>

          <div class="back-pill cut-sm"><svg width="16" height="16" viewBox="0 0 24 24" stroke="var(--color-on-surface)" stroke-width="2.5" fill="none"><path d="M15 18l-6-6 6-6"/></svg></div>
          <div class="merchant-logo cut-sm">MERCHANT</div>

          <div class="action-rail">
            <div class="icon-btn active rounded-lg" style="position:relative;">
              <svg viewBox="0 0 24 24"><path d="M12.1 21s-7.6-4.6-10-9.3C.6 8.1 2.4 4.5 6 4.5c2 0 3.6 1 4.8 2.6C12 5.5 13.6 4.5 15.6 4.5c3.6 0 5.4 3.6 3.9 7.2-2.4 4.7-10 9.3-10 9.3z"/></svg>
              <div class="spec-note" style="left:-244px; top:-6px;">
                Like icon shown <strong>active</strong>: gradient fill + 0.28s pop on tap, toast feedback. Same three icons, same position, same tap behavior as today — chrome only.
              </div>
            </div>
            <div class="icon-btn rounded-lg"><svg viewBox="0 0 24 24" stroke="var(--color-on-surface-variant)" stroke-width="2" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></div>
            <div class="icon-btn rounded-lg"><svg viewBox="0 0 24 24" stroke="var(--color-on-surface-variant)" stroke-width="2" fill="none"><circle cx="9" cy="20" r="1.4" fill="var(--color-on-surface-variant)"/><circle cx="17" cy="20" r="1.4" fill="var(--color-on-surface-variant)"/><path d="M2 3h2l2.2 11.4A2 2 0 0 0 8.2 16h8.6a2 2 0 0 0 2-1.6L20 6H6"/></svg></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
